name: Verify 76e source re-check layer

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    name: 76e — cost re-derivation, source domains, page/data parity, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the layer (must be byte-identical)
        run: |
          python3 scripts/build_76e_site.py
          git diff --exit-code -- 76e-verification.html data/76e_costs.csv data/76e_recheck.csv data/76e_findings.csv

      - name: Independent verification of every row and figure
        run: python3 scripts/verify_76e.py

      - name: Repo-wide internal link check and data contract (must not regress)
        run: |
          python3 scripts/check_links.py
          python3 scripts/validate_data.py
