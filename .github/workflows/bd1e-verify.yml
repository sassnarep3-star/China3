name: Verify bd1e decision page

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bd1e:
    name: bd1e — recompute every figure, source every row, resolve every link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the page (must be byte-identical)
        run: |
          python3 scripts/build_bd1e_site.py
          git diff --exit-code -- bd1e-decision.html assets/bd1e.css data/bd1e_ladder.csv data/bd1e_drift.csv

      - name: Independent verification of every row, figure, source and link
        run: python3 scripts/verify_bd1e.py

      - name: Repo-wide internal link check (must not regress)
        run: python3 scripts/check_links.py

      - name: Repo-wide data contract (must not regress)
        run: python3 scripts/validate_data.py
