name: bea4 re-verification gate

# Session arena/bea42a88-china3 (11 Nov 2026). Scoped to this namespace's files only: it re-derives
# the cost ladder in independent code, rebuilds the two bea4 pages and fails on any drift, then checks
# that every table row carries an official source link and every internal link resolves.

on:
  push:
    branches: ["**"]
    paths:
      - "bea4-*.html"
      - "data/bea4_*.csv"
      - "data/bea4_summary.json"
      - "data/e347_*.csv"
      - "scripts/bea4_recheck.py"
      - "scripts/build_bea4_site.py"
      - "scripts/verify_bea4_site.py"
      - ".github/workflows/bea4-verify.yml"
  pull_request:
    paths:
      - "bea4-*.html"
      - "data/bea4_*.csv"
      - "data/bea4_summary.json"
      - "data/e347_*.csv"
      - "scripts/bea4_*.py"
      - "scripts/build_bea4_site.py"
      - "scripts/verify_bea4_site.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Split into two steps so a red run says which half broke, and surface the first 20 lines
      # of any failure as an annotation (the job log host is not always reachable from a session).
      - name: Re-derive the cost ladder and penalty exposure (must be idempotent)
        run: |
          set -o pipefail
          python3 scripts/bea4_recheck.py 2>&1 | tail -40
          if ! git diff --quiet -- data/bea4_cost_recheck.csv data/bea4_repricing.csv \
               data/bea4_penalty_exposure.csv data/bea4_summary.json; then
            git --no-pager diff --stat -- data/bea4_* | sed 's/^/::error::stale: /'
            echo "::error::bea4 data files are stale — run python3 scripts/bea4_recheck.py and commit"
            exit 1
          fi
      - name: Every row sourced, every link resolved, figures recomputed
        run: |
          set -o pipefail
          python3 scripts/verify_bea4_site.py 2>&1 | tee /tmp/bea4-verify.log | tail -40
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            head -20 /tmp/bea4-verify.log | sed 's/^/::error::/'
            exit "$status"
          fi
