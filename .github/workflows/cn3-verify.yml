name: Verify consolidated CNY→USD dashboard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidated:
    name: Re-derive 680 rows, sources, blanks and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the dashboard from its data module
        run: python3 scripts/build_cn3.py

      - name: Require deterministic generated files
        run: >
          git diff --exit-code --
          data/cn3_sources.csv data/cn3_inputs.csv data/cn3_methods.csv
          data/cn3_ladder.csv data/cn3_steps.csv data/cn3_flags.csv
          cn3-cost.html cn3-methods.html cn3-tax.html
          cn3-steps.html cn3-review.html cn3-sources.html

      - name: Line-by-line verification (independent arithmetic)
        run: python3 scripts/verify_cn3.py

      - name: Confirm the other sessions' contracts still pass
        run: |
          python3 scripts/validate_data.py
          python3 scripts/check_links.py
          python3 scripts/verify_deep.py
          python3 scripts/test_costs.py
          python3 scripts/verify_s436_site.py
