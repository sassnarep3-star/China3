name: Verify cost coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  costs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_costs.py
      - run: git diff --exit-code -- costs.html cost-review.html data/cost-grid.csv data/cost-flags.json
