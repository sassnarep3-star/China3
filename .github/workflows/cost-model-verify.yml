name: Verify cost tables

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-model:
    name: Cost model and page verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-derive every figure and check the data contract
        run: python3 scripts/verify_cost_tables.py

      - name: Confirm no other session's data contract broke
        run: |
          python3 scripts/validate_data.py
          python3 scripts/check_links.py
          python3 scripts/verify_deep.py
