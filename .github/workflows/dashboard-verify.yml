name: Verify dashboard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard rows, ladder and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate and confirm the pages are not stale
        run: python3 scripts/build_dashboard.py --check

      - name: Verify every row, source and link
        run: python3 scripts/verify_dashboard.py
