name: e0f4-verify
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for the conflict-marker merge-base
        run: git fetch origin main || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build check (structure of the audit page)
        run: python3 scripts/build_e0f4_audit.py
      - name: Content gate (figures, links, findings, conflict markers)
        run: python3 scripts/verify_e0f4_audit.py
