name: e347 dashboard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are up to date
        run: python3 scripts/e347_build.py --check
      - name: Rows sourced, blanks flagged, arithmetic recomputed, links resolve
        run: python3 scripts/e347_verify.py
