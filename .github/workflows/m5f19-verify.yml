name: Verify m5f19 site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5f19:
    name: m5f19 provenance, cost re-derivation and reconciliation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check J compares the working tree against the merge base, so the
          # verifier needs history rather than a depth-1 clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the cost ladder (engine self-checks run here)
        run: python3 scripts/m5f19_engine.py

      - name: Regenerate the verified data pack (must be idempotent)
        run: |
          python3 scripts/gen_m5f19_data.py
          python3 scripts/gen_m5f19_tables.py
          git diff --exit-code -- data/m5f19_

      - name: Confirm the pages are not stale
        run: python3 scripts/build_m5f19_site.py --check

      - name: Independent verification of every row, source, link and figure
        run: python3 scripts/verify_m5f19_site.py

      - name: Repo-wide internal link check (must not regress)
        run: python3 scripts/check_links.py

      - name: Repo-wide data contract (must not regress)
        run: python3 scripts/validate_data.py
