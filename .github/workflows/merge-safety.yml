name: Merge safety

# Unresolved conflict markers were merged into main twice (PR #41 and PR #46). The first broke the
# published landing page. This gate runs on every push and every pull request and fails if any
# tracked text file still contains a marker. It reads files only; it changes nothing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conflict-markers:
    name: No merge-conflict markers in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The check itself works (catches a conflicted file, ignores prose about markers)
        run: python3 scripts/check_conflict_markers.py --self-test

      - name: No tracked file contains a conflict marker
        run: python3 scripts/check_conflict_markers.py
