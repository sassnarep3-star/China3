name: Deploy static guide to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# e347: pull-request builds used to share one group with the deploy on main, so a push to any
# open PR cancelled a deploy in progress (logged several times in COORDINATION.md). Each PR now
# has its own group and deploys from main only ever replace an older deploy from main.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check site files and local navigation
        run: |
          test -s index.html
          test -s routes.html
          test -s tax.html
          test -s review.html
          test -s sources.html
          test -s assets/site.css
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href', '')
                      if href and not href.startswith(('http://', 'https://', 'mailto:', 'tel:', '#')):
                          self.hrefs.append(href.split('#',1)[0])
          pages = [Path(p) for p in ('index.html','routes.html','tax.html','review.html','sources.html')]
          missing=[]
          for page in pages:
              parser=Links(); parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.hrefs:
                  if href and not (page.parent / href).exists(): missing.append(f'{page}: {href}')
          if missing:
              raise SystemExit('Missing local links:\n'+'\n'.join(missing))
          print(f'Checked local navigation in {len(pages)} pages')
          PY
      - name: Build and check the dashboard (landing page, dashboard/, archive list)
        run: |
          python3 scripts/e347_build.py
          python3 scripts/e347_verify.py
          test -s dashboard/site.css
          test -s legacy-index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
