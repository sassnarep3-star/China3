name: Deploy static guide to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required site files
        run: |
          for f in index.html routes.html tax.html review.html sources.html \
                   executive-summary.html china-rules.html us-tax.html channels.html \
                   penalty.html findings.html assets/site.css assets/app.js \
                   data/sources.csv data/china_rules.csv data/us_rules.csv \
                   data/channels.csv data/penalty.csv data/findings.csv data/flags.csv; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
      - name: Line-by-line row and broken-link verification
        run: python3 scripts/verify.py
      - name: Check local navigation in every HTML page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for key in ('href','src'):
                      h=a.get(key,'')
                      if h and not h.startswith(('http://','https://','mailto:','tel:','#','data:')):
                          self.hrefs.append(h.split('#',1)[0])
          pages=sorted(Path('.').glob('*.html'))
          missing=[]
          for page in pages:
              p=Links(); p.feed(page.read_text(encoding='utf-8'))
              for href in p.hrefs:
                  if href and not (page.parent/href).exists():
                      missing.append(f'{page}: {href}')
          if missing:
              raise SystemExit('Missing local links:\n'+'\n'.join(missing))
          print(f'Checked local navigation in {len(pages)} pages')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
